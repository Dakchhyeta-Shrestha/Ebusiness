<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MochiMaid — Login</title>
<style>
:root{
  --purple:#6f3cc3;
  --pink:#e95a9d;
  --green:#0b8369;
  --ink:#172033;
  --muted:#667085;
  --line:#d7dce4;
  --error:#dc2626;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
body{
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:34px 20px;

  /*
    To add your own image later:
    1. Put the image in this folder as "login-background.png"
    2. The page will automatically use it.
  */
  background-image:
    linear-gradient(rgba(31,41,55,.24),rgba(31,41,55,.24)),
    url("login-background.png"),
    linear-gradient(135deg,#eadffc 0%,#ffdce9 48%,#dffbf4 100%);
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

.login-card{
  width:min(520px,94vw);
  background:#fff;
  border-radius:18px;
  padding:38px 42px 36px;
  box-shadow:0 24px 70px rgba(15,23,42,.22);
}

.logo{
  display:inline-block;
  font-size:30px;
  font-weight:900;
  letter-spacing:-1px;
  color:var(--purple);
  cursor:pointer;
  margin-bottom:26px;
}
.logo span{color:var(--pink)}

h1{
  margin:0 0 30px;
  font-size:38px;
  letter-spacing:-1px;
  line-height:1.05;
}

.field{margin-bottom:15px}
.field label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:800;
  color:#273449;
}
.input-wrap{position:relative}
.field input{
  width:100%;
  min-height:54px;
  padding:12px 48px 12px 16px;
  border:1.5px solid #cbd5e1;
  border-radius:999px;
  background:#fff;
  color:#1f2937;
  font-size:16px;
  outline:none;
}
.field input:focus{
  border-color:var(--purple);
  box-shadow:0 0 0 4px rgba(111,60,195,.10);
}
.field input.invalid{border-color:#ef4444}
.toggle-password{
  position:absolute;
  right:15px;
  top:50%;
  transform:translateY(-50%);
  width:32px;
  height:32px;
  border:0;
  border-radius:50%;
  background:transparent;
  color:#667085;
  cursor:pointer;
  font-size:17px;
}
.field-error{
  display:none;
  margin:6px 0 0 5px;
  color:var(--error);
  font-size:12px;
  font-weight:700;
}
.field-error.show{display:block}

.password-help{
  display:inline-block;
  margin:10px 0 28px;
  color:var(--purple);
  text-decoration:none;
  font-size:13px;
  font-weight:800;
}

.primary-btn{
  width:100%;
  min-height:48px;
  border:0;
  border-radius:999px;
  background:linear-gradient(90deg,var(--purple),var(--pink));
  color:#fff;
  font-size:16px;
  font-weight:800;
  cursor:pointer;
}
.primary-btn:hover{filter:brightness(.98)}

.divider{
  display:flex;
  align-items:center;
  gap:12px;
  margin:20px 0;
  color:#6b7280;
  font-size:13px;
}
.divider::before,.divider::after{
  content:"";
  height:1px;
  flex:1;
  background:#d1d5db;
}

.secondary-btn{
  width:100%;
  min-height:48px;
  border:1.5px solid #cbd5e1;
  border-radius:999px;
  background:#fff;
  color:#1f2937;
  font-size:16px;
  cursor:pointer;
}
.secondary-btn:hover{background:#f8fafc}

.signup-name{display:none}
.signup-name.show{display:block}

.project-note{
  text-align:center;
  margin:16px 0 0;
  color:#98a2b3;
  font-size:11px;
}

.back-link{
  display:block;
  text-align:center;
  margin-top:17px;
  color:#667085;
  text-decoration:none;
  font-size:12px;
}
.back-link:hover{color:var(--purple)}

@media(max-width:600px){
  body{padding:20px 14px}
  .login-card{padding:30px 24px}
  h1{font-size:32px}
}

.field-error{
  font-size:13px!important;
  margin-top:7px!important;
}
.project-note{
  max-width:390px;
  margin-left:auto!important;
  margin-right:auto!important;
  line-height:1.45;
}

</style>
</head>
<body>

<main class="login-card">
  <div class="logo" onclick="goHome()">Mochi<span>Maid</span></div>

  <h1 id="pageTitle">Welcome</h1><p id="bookingReturnNote" style="font-size:14px;line-height:1.6;color:#667085" hidden>Log in or create an account to continue to payment. Your cleaning details are saved.</p>

  <div id="nameField" class="field signup-name">
    <label for="name">Full Name*</label>
    <div class="input-wrap">
      <input id="name" type="text" placeholder="Enter your full name" required>
    </div>
    <div id="nameError" class="field-error">Full name is required</div>
  </div>

  <div class="field">
    <label for="email">Email Address*</label>
    <div class="input-wrap">
      <input id="email" type="email" placeholder="Enter your email" required>
    </div>
    <div id="emailError" class="field-error">Email is required</div>
  </div>

  <div class="field">
    <label for="password">Password*</label>
    <div class="input-wrap">
      <input id="password" type="password" placeholder="Enter a password" required>
      <button id="togglePassword" class="toggle-password" type="button" aria-label="Show password">◉</button>
    </div>
    <div id="passwordError" class="field-error">Password is required</div>
  </div>

  <a id="passwordHelp" class="password-help" href="#">Need help with your password?</a>

  <button id="submitBtn" class="primary-btn" type="button">Log in</button>

  <div class="divider">OR</div>

  <button id="switchModeBtn" class="secondary-btn" type="button">Sign up instead</button>

  
  <a class="back-link" href="index.html">← Back to MochiMaid</a>
</main>

<script>
let mode="login";

const params=new URLSearchParams(location.search);
const bookingState=params.get("state")||(params.get("resume")==="booking"?sessionStorage.getItem("mmPendingBooking"):"")||"";

document.getElementById("bookingReturnNote").hidden=!bookingState;
const pageTitle=document.getElementById("pageTitle");
const nameField=document.getElementById("nameField");
const submitBtn=document.getElementById("submitBtn");
const switchModeBtn=document.getElementById("switchModeBtn");
const passwordHelp=document.getElementById("passwordHelp");

const nameInput=document.getElementById("name");
const emailInput=document.getElementById("email");
const passwordInput=document.getElementById("password");

const nameError=document.getElementById("nameError");
const emailError=document.getElementById("emailError");
const passwordError=document.getElementById("passwordError");

function goHome(){
  location.href="index.html";
}

function clearErrors(){
  [nameInput,emailInput,passwordInput].forEach(input=>input.classList.remove("invalid"));
  [nameError,emailError,passwordError].forEach(error=>error.classList.remove("show"));
}

function setMode(next){
  mode=next;
  clearErrors();

  const signingUp=mode==="signup";
  nameField.classList.toggle("show",signingUp);

  pageTitle.textContent=signingUp ? "Create your account" : "Welcome";
  submitBtn.textContent=signingUp ? "Sign up" : "Log in";
  switchModeBtn.textContent=signingUp ? "Log in instead" : "Sign up instead";
  passwordHelp.style.display=signingUp ? "none" : "inline-block";
}

switchModeBtn.addEventListener("click",()=>{
  setMode(mode==="login" ? "signup" : "login");
});

document.getElementById("togglePassword").addEventListener("click",()=>{
  const showing=passwordInput.type==="text";
  passwordInput.type=showing ? "password" : "text";
  document.getElementById("togglePassword").setAttribute(
    "aria-label",
    showing ? "Show password" : "Hide password"
  );
});


[nameInput,emailInput,passwordInput].forEach(input=>{
  input.addEventListener("input",()=>{
    input.classList.remove("invalid");
    const map={
      name:nameError,
      email:emailError,
      password:passwordError
    };
    map[input.id]?.classList.remove("show");
  });
});

submitBtn.addEventListener("click",()=>{
  clearErrors();

  const email=emailInput.value.trim();
  const password=passwordInput.value.trim();
  const name=nameInput.value.trim();

  let valid=true;
  let firstInvalid=null;

  // For this class project we ONLY validate that required fields contain something.
  // We are not checking credentials against a real user database.
  if(mode==="signup" && !name){
    nameInput.classList.add("invalid");
    nameError.classList.add("show");
    firstInvalid=firstInvalid || nameInput;
    valid=false;
  }

  if(!email){
    emailInput.classList.add("invalid");
    emailError.classList.add("show");
    firstInvalid=firstInvalid || emailInput;
    valid=false;
  }

  if(!password){
    passwordInput.classList.add("invalid");
    passwordError.classList.add("show");
    firstInvalid=firstInvalid || passwordInput;
    valid=false;
  }

  if(!valid){
    firstInvalid?.focus();
    return;
  }

  // Required fields are filled, so create a simple local demo session.
  sessionStorage.setItem("mmLoggedIn","1");
  localStorage.setItem("mmUserEmail",email);
  if(mode==="signup" && name){
    localStorage.setItem("mmUserName",name);
  }else if(!localStorage.getItem("mmUserName")){
    const fallback=email.split("@")[0].replace(/[._-]+/g," ");
    localStorage.setItem("mmUserName",fallback.replace(/\b\w/g,c=>c.toUpperCase()) || "MochiMaid Customer");
  }

  // If login was triggered during booking, return to payment.
  if(bookingState){
    location.href=`index.html?auth=1&state=${encodeURIComponent(bookingState)}`;
  }else{
    // Direct login from the homepage opens the customer dashboard.
    location.href="dashboard.html";
  }
});
</script>

</body>
</html>
